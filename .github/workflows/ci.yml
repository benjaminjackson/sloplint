name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.3", "3.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
      # No Gemfile by design (see CLAUDE.md) -- install the dev deps the
      # gemspec declares directly, rather than bundling.
      - run: gem install "rspec:~> 3.0" "rake:~> 13.0" --no-document
      - run: rake spec
      - run: gem build sloplint.gemspec
      - run: ruby -e 'Gem::Specification.load("sloplint.gemspec").validate'
      - run: gem build sloplint-judge.gemspec
      - run: ruby -e 'Gem::Specification.load("sloplint-judge.gemspec").validate'
      # Install both built gems away from the checkout and load them: the two
      # gems live in different directories once installed, and a require that
      # resolves only inside the repository would pass every step above.
      - run: |
          gem install --local --no-document ./sloplint-*.gem ./sloplint-judge-*.gem
          cd /tmp && sloplint-judge version && sloplint-judge rules >/dev/null
          # No key in CI, so --judge and status must exit 2 (not configured), not crash.
          # Read the message, not just the code: a cross-gem require that
          # broke exits 2 as well, through the "install the judge gem" path,
          # and that is the one failure this step exists to catch.
          set +e; echo "One. Two. Three." | sloplint check --judge - 2>/tmp/judge.err; status=$?; set -e
          test "$status" -eq 2
          cat /tmp/judge.err
          grep -q TYPESAFE_API_KEY /tmp/judge.err
          ! grep -q "gem install sloplint-judge" /tmp/judge.err
          set +e; sloplint-judge status 2>/tmp/status.err; status=$?; set -e
          test "$status" -eq 2
          grep -q TYPESAFE_API_KEY /tmp/status.err
      # sloplint also ships as a Claude Code plugin. Skipped when the runner
      # has no `claude` binary -- the local check covers it then.
      - run: command -v claude >/dev/null && claude plugin validate . --strict || echo "no claude binary, skipping"
